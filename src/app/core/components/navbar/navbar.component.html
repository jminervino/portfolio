<nav class="navbar-modern">
  <div class="navbar-container">
    <!-- Logo/Brand -->
    <a href="#" class="navbar-brand" (click)="scrollToSection('#home')">
      <span class="brand-bracket">{{ '{' }}</span>
      <span class="brand-name">João</span>
      <span class="brand-bracket">{{ '}' }}</span>
    </a>

    <!-- Desktop Menu -->
    <div class="navbar-menu">
      <ul class="navbar-nav">
        <li class="nav-item" *ngFor="let link of navbarLinks">
          <a class="nav-link" (click)="scrollToSection(link.link)">
            {{ link.text }}
          </a>
        </li>
      </ul>

      <!-- Theme Toggle Button -->
      <button class="theme-toggle" (click)="themeService.toggleTheme()"
              [attr.aria-label]="themeService.isDarkMode ? 'Mudar para tema claro' : 'Mudar para tema escuro'">
        <svg *ngIf="!themeService.isDarkMode" class="theme-icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
        </svg>
        <svg *ngIf="themeService.isDarkMode" class="theme-icon" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
      </button>

      <!-- Download CV Button -->
      <a href="/assets/pdf/curriculo-joao-victor-minervino.pdf"
         class="btn-cv"
         download="Curriculo-Joao-Victor.pdf">
        <svg class="cv-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        Baixar CV
      </a>
    </div>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-toggle"
            (click)="toggleMenu()"
            [class.open]="isMenuOpen"
            aria-label="Toggle mobile menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <div class="mobile-menu-content">
      <ul class="mobile-nav">
        <li class="mobile-nav-item" *ngFor="let link of navbarLinks">
          <a class="mobile-nav-link" (click)="scrollToSection(link.link)">
            {{ link.text }}
          </a>
        </li>
      </ul>

      <div class="mobile-menu-footer">
        <!-- Theme Toggle Mobile -->
        <button class="theme-toggle mobile" (click)="themeService.toggleTheme()">
          <svg *ngIf="!themeService.isDarkMode" class="theme-icon" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
          </svg>
          <svg *ngIf="themeService.isDarkMode" class="theme-icon" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
          </svg>
          {{ themeService.isDarkMode ? 'Tema Claro' : 'Tema Escuro' }}
        </button>

        <!-- Download CV Mobile -->
        <a href="/assets/pdf/curriculo-joao-victor-minervino.pdf"
           class="btn-cv mobile"
           download="Curriculo-Joao-Victor.pdf"
           (click)="closeMenu()">
          <svg class="cv-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          Baixar CV
        </a>
      </div>
    </div>
  </div>
</nav>
