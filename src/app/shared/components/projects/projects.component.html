<section class="projects-section section-padding">
  <div class="container-custom">
    <!-- Section Header -->
    <div class="section-header">
      <h2 class="section-title">Meus Projetos</h2>
      <p class="section-subtitle">
        Alguns dos projetos que desenvolvi ao longo da minha carreira
      </p>
    </div>

    <!-- Filter Buttons (opcional - pode implementar depois) -->
    <div class="project-filters">
      <button class="filter-btn" [class.active]="activeFilter === 'Todos'" (click)="applyFilter('Todos')">Todos</button>
      <button class="filter-btn" [class.active]="activeFilter === 'Frontend'" (click)="applyFilter('Frontend')">Frontend</button>
      <button class="filter-btn" [class.active]="activeFilter === 'Web'" (click)="applyFilter('Web')">Web</button>
      <button class="filter-btn" [class.active]="activeFilter === 'Full Stack'" (click)="applyFilter('Full Stack')">Full Stack</button>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid">
      <div class="project-item" *ngFor="let project of filteredProjects; let i = index">
        <app-card-project [project]="project"></app-card-project>
      </div>
    </div>

  </div>
</section>
