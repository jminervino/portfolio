<section class="projects-section section-padding">
  <div class="container-custom">
    <!-- Section Header -->
    <div class="section-header">
      <h2 class="section-title">Meus Projetos</h2>
      <p class="section-subtitle">
        Alguns dos projetos que desenvolvi ao longo da minha carreira
      </p>
    </div>

    <!-- Filter Buttons (opcional - pode implementar depois) -->
    <div class="project-filters">
      <button class="filter-btn active">Todos</button>
              <button class="filter-btn">Frontend</button>
      <button class="filter-btn">Web</button>
      <button class="filter-btn">Full Stack</button>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid">
      <div class="project-item" *ngFor="let project of listProjects; let i = index">
        <app-card-project [project]="project"></app-card-project>
      </div>
    </div>

    <!-- Call to Action -->
    <div class="projects-cta">
      <h3>Interessado em trabalhar comigo?</h3>
      <p>Vamos conversar sobre como posso ajudar no seu próximo projeto</p>
      <button class="cta-button" (click)="scrollToContact()">
        <i class="fas fa-paper-plane"></i>
        Entre em Contato
      </button>
    </div>
  </div>
</section>
